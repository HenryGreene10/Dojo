<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahjong Dojo Preview</title><link rel="stylesheet" href="./src/app/globals.css"></head>
<body><main class="invite-page"><div class="invite-wrap"><nav class="invite-nav"><span class="brand-mark"><span class="brand-tile">東</span><span>Mahjong Dojo</span></span></nav><article class="invite-card"><header class="invite-hero"><div class="eyebrow">Hosted by Susan</div><h1>Friday Mah Jong</h1><div class="invite-meta"><span>Friday, September 18</span><span>·</span><span>1:00 PM</span></div><div class="invite-location">Susan's house</div></header><div class="invite-body"><div class="capacity-row"><div><h2>The Thursday Dojo</h2><p id="count">6 of 8 seats taken</p></div><button class="small-btn">Share</button></div><div class="tables-grid">
<section class="game-table"><div class="table-title">Table 1</div><div class="table-surface"></div><div class="seat seat-1">Susan</div><div class="seat seat-2">Joan</div><div class="seat seat-3">Nancy</div><div class="seat seat-4">Carol</div></section>
<section class="game-table"><div class="table-title">Table 2</div><div class="table-surface"></div><div class="seat seat-1">Linda</div><div class="seat seat-2">Barbara</div><div class="seat seat-3 empty" id="openSeat">Open seat</div><div class="seat seat-4 empty">Open seat</div></section></div>
<div class="join-panel" id="join"><button class="btn btn-primary btn-wide" id="enter">Enter the dojo</button></div></div></article></div></main>
<script>document.getElementById('enter').onclick=()=>{document.getElementById('join').innerHTML='<form class="join-form" id="form"><div><label class="label">Your name</label><input class="input" id="name" placeholder="Barbara" autofocus></div><button class="btn btn-primary btn-wide">Take a seat</button></form>';document.getElementById('form').onsubmit=(e)=>{e.preventDefault();const n=document.getElementById('name').value.trim()||'Eleanor';const s=document.getElementById('openSeat');s.textContent=n;s.classList.remove('empty');document.getElementById('count').textContent='7 of 8 seats taken';document.getElementById('join').innerHTML='<div class="status-card"><strong>You’re at Table 2.</strong>Your seat is saved. See you at the table.</div>'}}</script></body></html>
